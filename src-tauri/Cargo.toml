[package]
name = "wisprnote-ai"
version = "1.0.0"
description = "Wisprnote AI - Meeting Notes & Transcription"
authors = ["Wisprnote Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-http = "2.5.8"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre", features = ["ca", "av", "cf", "ns", "blocks", "async"] }
ringbuf = "0.4"
