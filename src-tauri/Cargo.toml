[package]
name = "wisprnote-ai"
version = "1.0.0"
description = "Wisprnote AI - Meeting Notes & Transcription"
authors = ["Wisprnote Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["devtools", "tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-http = "2.5.8"
tauri-plugin-fs = "2"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre", features = ["ca", "av", "cf", "ns", "blocks", "async"] }
ringbuf = "0.4"
cpal = "0.17"
# Native NSProcessInfo activity API — disables macOS App Nap while recording so
# the (backgrounded) main window's WebView stays responsive during a meeting.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
# Convert the floating overlay windows into non-activating NSPanels — so their
# buttons act on the first click and they never steal focus from the app the
# user is in (the behavior anarlog/Hyprnote gets from native NSPanels).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# Accessibility (AXUIElement) — reads the meeting app's own participant tiles to
# learn WHO is speaking. Meeting apps publish no roster API; the accessibility
# tree is the only surface Zoom/Meet/Teams/Slack all expose to another process.
core-foundation = "0.9"
core-foundation-sys = "0.8"
# NSRunningApplication — resolves a meeting app's bundle id to the process id the
# accessibility tree is addressed by.
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
